<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{CAT_EN}} · {{BRAND}}</title>
<meta name="description" content="Find shops near you on {{BRAND}}: grocery, restaurants, salons, clinics and repair. Order with just your name and number.">
<meta property="og:title" content="{{BRAND}} · What do you need today?">
<meta property="og:description" content="Pick what you need and order in a tap.">
<meta name="theme-color" content="#fb7a2c">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="{{BRAND}}">
<link rel="stylesheet" href="/shops.css?v=10.16.2">
</head>
<body class="cust c-list" data-cat="{{CAT_KEY}}">
<header class="c-top">
  <a class="c-brand" href="/">{{BRAND_MARK}}<span><b>{{BRAND}}</b><small data-en="Shops near you" data-hi="आपके पास की दुकानें">Shops near you</small></span></a>
  <button class="lang" id="langBtn" type="button" aria-label="Switch language">EN</button>
</header>
<section class="c-hero c-hero-list t-{{CAT_STYLE}}">
  <a class="c-back" href="/shops" id="backBtn"><span aria-hidden="true">‹</span> <b data-en="All categories" data-hi="सभी कैटेगरी">All categories</b></a>
  <h1 class="c-cat-h"><span class="c-cat-ic" aria-hidden="true">{{CAT_ICON}}</span><span data-en="{{CAT_EN}}" data-hi="{{CAT_HI}}">{{CAT_EN}}</span></h1>
  <div class="c-tools">
    <div class="c-search" role="search">
      <span class="c-s-ic" aria-hidden="true">🔍</span>
      <label class="sr" for="q" data-en="Search in this list" data-hi="इस लिस्ट में खोजें">Search in this list</label>
      <input id="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="Search in this list" data-ph-en="Search in this list" data-ph-hi="इस लिस्ट में खोजें">
    </div>
    <button type="button" class="near" id="nearBtn"><span aria-hidden="true">📍</span> <b data-en="Near me" data-hi="पास में">Near me</b></button>
  </div>
  <span class="blob b1" aria-hidden="true"></span><span class="blob b2" aria-hidden="true"></span>
</section>
<main class="c-main" data-n="{{SHOP_COUNT}}">
  <p class="c-note" id="note" role="status" aria-live="polite" hidden></p>
  <ul class="cards" id="cards">{{SHOP_CARDS}}</ul>
  <div class="empty" id="empty" hidden><span aria-hidden="true">🔎</span><b data-en="No shops found" data-hi="कोई दुकान नहीं मिली">No shops found</b><small data-en="Try another word." data-hi="कोई और शब्द आज़माएँ।">Try another word.</small></div>
  <div class="empty none"><span aria-hidden="true">{{CAT_ICON}}</span><b data-en="Coming soon" data-hi="जल्द आ रहा है">Coming soon</b><small data-en="No shops in this category yet. Ask your local shop to join, it's free to start." data-hi="इस कैटेगरी में अभी कोई दुकान नहीं। अपनी पास की दुकान को जुड़ने के लिए कहें, शुरुआत मुफ़्त है।">No shops in this category yet. Ask your local shop to join, it's free to start.</small><a class="e-back" href="/shops" data-en="See other categories" data-hi="दूसरी कैटेगरी देखें">See other categories</a></div>
</main>
<!-- v10.15.1: shopkeeper footer button removed here too (Krish 12:14 AM "Ye hatao"); shopkeepers use /admin -->
<script src="/shops.js?v=10.16.2"></script>
</body>
</html>
