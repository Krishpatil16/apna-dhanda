<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="ak-shop" content=""><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#153d35"><meta name="ak-app" content="shop"><link rel="icon" href="/icon.svg" type="image/svg+xml"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Salon"><title>Salon booking</title><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/salon.css?v=10.16.2"></head>
<body class="salon-book">
<header class="salon-head"><div class="salon-head-top"><span class="salon-brand">✦ Apna Dhanda</span><button class="salon-lang lang" id="langBtn" type="button" aria-label="Language / भाषा">EN | हिंदी</button></div><div class="salon-hero"><span class="salon-seal" aria-hidden="true">✂️</span><div><span class="salon-overline" data-l="YOUR SALON|आपका सैलून">YOUR SALON</span><h1 id="salonName">Salon</h1><div class="salon-status"><span id="salonStatus">● Open now</span><span class="salon-dot">·</span><span id="salonTag" data-l="A fresh look starts here|नया लुक यहाँ से शुरू">A fresh look starts here</span></div></div></div></header>
<main class="salon-main"><div class="salon-intro"><div class="salon-eyebrow" data-l="BOOK YOUR VISIT|अपनी बुकिंग करें">BOOK YOUR VISIT</div><h2 data-l="What are we doing today?|आज क्या करवाना है?">What are we doing today?</h2><p data-l="Choose as many services as you like. The salon confirms your request.|जितनी सेवाएँ चाहिए चुनें। सैलून आपकी रिक्वेस्ट कन्फर्म करेगा।">Choose as many services as you like. The salon confirms your request.</p></div><div id="salonGroups" class="salon-groups"><p class="salon-loading">Loading services…</p></div><div class="salon-end"><span>✦</span><span data-l="Good things take a little time.|अच्छी चीज़ों में थोड़ा वक़्त लगता है।">Good things take a little time.</span></div></main>
<div class="salon-bottom"><button id="bookBtn" class="salon-book-btn" type="button" disabled><span id="selCount">0 selected</span><span data-l="Book appointment →|बुकिंग करें →">Book appointment →</span></button></div>
<nav class="salon-nav" aria-label="Salon menu"><a id="navServices" href="/" aria-current="page"><span aria-hidden="true">✂️</span><b data-l="Services|सेवाएँ">Services</b></a><a id="navBookings" href="/track"><span aria-hidden="true">📅</span><b data-l="My bookings|मेरी बुकिंग">My bookings</b></a></nav>
<div id="sheetBack" class="salon-sheet-back" hidden></div><section id="salonSheet" class="salon-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden><span class="salon-grab"></span><button id="sheetClose" class="salon-close" type="button" aria-label="Close">✕</button><div class="salon-sheet-mark">✂️</div><div class="salon-eyebrow" data-l="ONE LAST THING|बस एक बात और">ONE LAST THING</div><h2 id="sheetTitle" data-l="Who’s coming in?|किसके नाम से बुकिंग करें?">Who’s coming in?</h2><p id="sheetSummary" class="salon-summary"></p><form id="salonForm"><label for="guestName" data-l="Your name|आपका नाम">Your name</label><input id="guestName" name="name" type="text" autocomplete="name" required maxlength="60" placeholder="Your name"><p id="salonError" class="salon-error" role="alert"></p><button id="sendBtn" class="salon-submit" type="submit">Send request →</button></form><p class="salon-sheet-foot" id="sheetFoot"></p></section>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/common.js?v=10.16.2-2"></script><script src="/salon.js?v=10.16.2"></script></body></html>
